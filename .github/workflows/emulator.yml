name: Emulator smoke tests
run-name: "Emulator • API ${{ inputs.api-levels || 'default set' }}"

# Runs the instrumented smoke tests (ui/src/androidTest) on Android emulators, one API level at a
# time. Manual only: each level downloads a system image and boots an emulator (several minutes).
# Needs /dev/kvm inside the runner container (docker run --device /dev/kvm ...).
on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: "API levels as a JSON array, e.g. [21,23,34]"
        required: false
        default: "[21,23,24,26,29,34]"

permissions:
  contents: read

# The runner host is small and shared: never run two emulator jobs at once.
concurrency:
  group: emulator-tests
  cancel-in-progress: false

jobs:
  smoke:
    name: "API ${{ matrix.api }}"
    runs-on: [self-hosted, docker-runner]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: ${{ fromJSON(inputs.api-levels || '[21,23,24,26,29,34]') }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Check hardware acceleration (KVM)
      shell: bash
      run: |
        if [[ ! -e /dev/kvm ]]; then
          echo "::error::/dev/kvm is missing inside the runner container. Start the runner container with --device /dev/kvm (and enable nested virtualization on the host VM)."
          exit 1
        fi
        ls -l /dev/kvm
        nproc
        free -m

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: tunnel/tools/libwg-go/go.mod
        cache-dependency-path: tunnel/tools/libwg-go/go.sum

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    # The emulator binary links against X11/GL/audio libraries even when run with -no-window, and the
    # runner container image does not ship them ("error while loading shared libraries: libX11.so.6").
    # Installing them here is idempotent; the long-term fix is to bake them into the runner image.
    - name: Install emulator system libraries
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        SUDO=""; if [[ "$(id -u)" != "0" ]]; then SUDO="sudo"; fi
        ${SUDO} apt-get update -qq
        for pkg in libx11-6 libx11-xcb1 libxcb1 libxext6 libxrender1 libxtst6 libxi6 libxfixes3 \
                   libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libxkbcommon0 libxkbfile1 \
                   libxshmfence1 libnss3 libnspr4 libpulse0 libgl1 libglu1-mesa libdbus-1-3 \
                   libfontconfig1 libfreetype6 libgbm1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
                   libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0; do
          ${SUDO} apt-get install -y --no-install-recommends "${pkg}" >/dev/null \
            || echo "::warning::could not install ${pkg}"
        done
        # libasound2 was renamed to libasound2t64 on newer Ubuntu releases.
        ${SUDO} apt-get install -y --no-install-recommends libasound2t64 >/dev/null 2>&1 \
          || ${SUDO} apt-get install -y --no-install-recommends libasound2 >/dev/null \
          || echo "::warning::could not install libasound2"

    # Fail within seconds instead of waiting for the emulator boot timeout when libraries are missing.
    - name: Check the emulator starts
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager --install emulator --channel=0 >/dev/null
        EMU="${ANDROID_HOME}/emulator"
        if ! "${EMU}/emulator" -version | head -n 3; then
          echo "::error::The emulator binary does not start (missing shared libraries?)"
          exit 1
        fi
        export LD_LIBRARY_PATH="${EMU}/lib64:${EMU}/lib64/qt/lib:${EMU}/lib64/gles_swiftshader"
        for bin in "${EMU}"/qemu/linux-x86_64/qemu-system-x86_64*; do
          [[ -f "${bin}" ]] || continue
          missing="$(ldd "${bin}" 2>/dev/null | grep 'not found' || true)"
          if [[ -n "${missing}" ]]; then
            echo "::warning::${bin##*/} is missing libraries:"
            echo "${missing}"
          fi
        done

    - name: Resource diagnostics (before emulator)
      shell: bash
      run: |
        set +e
        echo "== memory =="; free -m
        echo "== /dev/shm =="; df -h /dev/shm
        echo "== container cgroup (memory.events oom_kill > 0 means the kernel killed a process) =="
        for f in memory.max memory.current memory.events; do echo "-- $f"; cat "/sys/fs/cgroup/$f" 2>/dev/null; done
        echo "== largest processes =="; ps -eo pid,rss,comm --sort=-rss | head -n 8
        echo "== emulator crash data =="; ls -la /tmp/android-unknown 2>/dev/null
        echo "== kernel log (best effort) =="; dmesg 2>/dev/null | tail -n 25
        exit 0

    - name: Instrumented smoke tests (API ${{ matrix.api }})
      uses: reactivecircus/android-emulator-runner@v2
      env:
        # See ci.yml: the native build relies on automatic Go toolchain download.
        GOTOOLCHAIN: auto
      with:
        api-level: ${{ matrix.api }}
        arch: x86_64
        target: google_apis
        ram-size: 2048M
        heap-size: 512M
        cores: 2
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics -show-kernel
        script: ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false :ui:connectedDebugAndroidTest

    - name: Resource diagnostics (after emulator)
      if: ${{ always() }}
      shell: bash
      run: |
        set +e
        echo "== memory =="; free -m
        echo "== /dev/shm =="; df -h /dev/shm
        echo "== container cgroup (memory.events oom_kill > 0 means the kernel killed a process) =="
        for f in memory.max memory.current memory.events; do echo "-- $f"; cat "/sys/fs/cgroup/$f" 2>/dev/null; done
        echo "== largest processes =="; ps -eo pid,rss,comm --sort=-rss | head -n 8
        echo "== emulator crash data =="; ls -la /tmp/android-unknown 2>/dev/null
        echo "== kernel log (best effort) =="; dmesg 2>/dev/null | tail -n 25
        exit 0

    - name: Upload test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: emulator-reports-api-${{ matrix.api }}
        path: ui/build/reports/androidTests/
        if-no-files-found: ignore
        retention-days: 7
