name: CI
run-name: "CI • ${{ github.event.pull_request.title || github.ref_name }}"

# Fast feedback on every pull request and on master: unit tests + debug APK.
# No secrets are used, so this never signs anything.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Unit tests & debug build"
    runs-on: [self-hosted, docker-runner]
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    # Runner containers have different memory limits; print them so a killed Gradle daemon
    # ("daemon disappeared unexpectedly") can be told apart from a real failure (oom_kill > 0).
    - name: Container resources (before build)
      shell: bash
      run: |
        set +e
        echo "runner: ${RUNNER_NAME}"
        free -m
        for f in memory.max memory.current memory.events; do echo "-- cgroup $f"; cat "/sys/fs/cgroup/$f" 2>/dev/null; done
        exit 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    # libwg-go (amneziawg-go) is built with Go during the NDK/CMake step.
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: tunnel/tools/libwg-go/go.mod
        cache-dependency-path: tunnel/tools/libwg-go/go.sum

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    # Fewer parallel tasks keeps peak memory down on the shared runner container.
    - name: Unit tests and debug APK
      # The native build fetches Go 1.24.2 itself while go.mod requires >= 1.25, which relies on
      # automatic toolchain download. setup-go v6 exports GOTOOLCHAIN=local, so restore the default.
      env:
        GOTOOLCHAIN: auto
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false \
          :tunnel:testDebugUnitTest :ui:assembleDebug

    - name: Upload debug APK
      uses: actions/upload-artifact@v5
      with:
        name: debug-apk
        path: ui/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 7

    - name: Upload test reports
      if: ${{ failure() }}
      uses: actions/upload-artifact@v5
      with:
        name: test-reports
        path: tunnel/build/reports/tests/
        if-no-files-found: ignore
        retention-days: 7

    - name: Container resources (after build)
      if: ${{ always() }}
      shell: bash
      run: |
        set +e
        echo "runner: ${RUNNER_NAME}"
        free -m
        for f in memory.max memory.current memory.events; do echo "-- cgroup $f"; cat "/sys/fs/cgroup/$f" 2>/dev/null; done
        exit 0
