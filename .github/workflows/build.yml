name: Manual build (unsigned validation)
run-name: "Manual build • ${{ inputs.target }} • ${{ inputs.ref || github.ref_name }}"

# Manual builds of any ref for testing. Uses no secrets and never signs: release outputs are
# labelled UNSIGNED and are not installable as updates. Signed APKs and the signed AAB come only
# from release.yml (version tags). See docs/ci-cd/workflows.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        required: true
        default: release_unsigned
        options:
        - release_unsigned
        - debug_apk
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "master"
      lint:
        description: "Also run Android lint (slow, memory hungry)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ inputs.target }})"
    runs-on: [self-hosted, docker-runner]
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        persist-credentials: false

    - name: Set up build environment
      uses: ./.github/actions/android-env
      with:
        gradle-cache-read-only: "true"
        min-memory-mib: "1200"

    - name: Build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        LINT: ${{ inputs.lint }}
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        flags=(--no-daemon --stacktrace --max-workers=2 -Dorg.gradle.parallel=false)
        lint_task=()
        case "${TARGET}" in
          debug_apk)
            [[ "${LINT}" == true ]] && lint_task=(:ui:lintDebug)
            ./gradlew "${flags[@]}" :ui:assembleDebug "${lint_task[@]}"
            ;;
          release_unsigned)
            [[ "${LINT}" == true ]] && lint_task=(:ui:lintRelease)
            ./gradlew "${flags[@]}" :ui:bundleRelease "${lint_task[@]}"
            ./gradlew "${flags[@]}" -PamneziawgSplitAbi=true :ui:assembleRelease
            ;;
          *) echo "::error::unknown target ${TARGET}"; exit 1 ;;
        esac

    - name: Collect outputs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/manual-build"
        rm -rf "${out}" && mkdir -p "${out}"
        version="$(sed -n 's/^amneziawgVersionName=//p' gradle.properties)"
        if [[ "${TARGET}" == debug_apk ]]; then
          cp ui/build/outputs/apk/debug/*.apk "${out}/"
        else
          for apk in ui/build/outputs/apk/release/ui-*-release-unsigned.apk; do
            abi="$(basename "${apk}" -release-unsigned.apk)"; abi="${abi#ui-}"
            cp "${apk}" "${out}/routevpn-${version}-${abi}-UNSIGNED.apk"
          done
          cp ui/build/outputs/bundle/release/ui-release.aab "${out}/routevpn-${version}-release-UNSIGNED.aab"
          echo "::warning::These release outputs are UNSIGNED validation builds. Do not distribute them."
        fi
        (cd "${out}" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
        echo "OUT=${out}" >> "$GITHUB_ENV"

    - name: Upload outputs
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ${{ inputs.target == 'debug_apk' && 'debug-apk' || 'unsigned-validation-build' }}
        path: ${{ env.OUT }}
        if-no-files-found: error
        retention-days: 7

    - name: Upload lint reports
      if: ${{ always() && inputs.lint }}
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: lint-reports
        path: ui/build/reports/lint-results-*.*
        if-no-files-found: ignore
        retention-days: 7
